<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f8f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0f10" media="(prefers-color-scheme: dark)">
<title>雪宝记账 · 下载与更新</title>
<meta name="description" content="雪宝记账安卓版下载与版本更新。">
<link rel="icon" type="image/png" href="assets/snowman.png">
<link rel="apple-touch-icon" href="assets/snowman.png">
<style>
  :root{
    --bg:#f8f8f7;
    --fg:#17171a;
    --muted:#73737a;
    --line:#e6e6e3;
    --button:#17171a;
    --button-fg:#ffffff;
    --focus:#17171a;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f0f10;
      --fg:#f0f0ec;
      --muted:#96969c;
      --line:#26262a;
      --button:#f0f0ec;
      --button-fg:#0f0f10;
      --focus:#f0f0ec;
    }
  }
  *{box-sizing:border-box;}
  html{color-scheme:light dark;}
  body{
    margin:0;
    min-height:100vh;
    font-family:var(--font);
    color:var(--fg);
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  .shell{
    width:min(100% - 44px,560px);
    margin:0 auto;
    padding:56px 0 32px;
  }
  .app-head{
    display:flex;
    align-items:center;
    gap:16px;
  }
  .app-head > div{min-width:0;}
  .app-head img{
    width:64px;height:64px;
    border-radius:15px;
    flex:none;
    display:block;
  }
  .app-head h1{
    margin:0;
    font-size:24px;
    line-height:1.25;
    font-weight:700;
    letter-spacing:-.3px;
  }
  .app-head .tagline{
    margin:4px 0 0;
    font-size:13px;
    line-height:1.5;
    color:var(--muted);
  }
  .meta{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:8px;
    margin:22px 0 0;
    font-size:12.5px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .meta span{display:inline-flex;align-items:center;gap:8px;}
  .meta span + span::before{
    content:"";
    width:1px;height:10px;
    background:var(--line);
  }
  .download{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    width:100%;
    height:50px;
    margin-top:16px;
    border-radius:10px;
    background:var(--button);
    color:var(--button-fg);
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    letter-spacing:.2px;
    text-decoration:none;
    transition:opacity 150ms ease;
    -webkit-tap-highlight-color:transparent;
  }
  .download:hover{opacity:.88;}
  .download:active{opacity:.76;}
  .download:focus-visible{
    outline:2px solid var(--focus);
    outline-offset:3px;
  }
  .download svg{
    width:17px;height:17px;
    flex:none;
  }
  .hint{
    margin:10px 0 0;
    font-size:12px;
    line-height:1.6;
    color:var(--muted);
    text-align:center;
  }
  .notes{
    margin-top:40px;
    padding-top:26px;
    border-top:1px solid var(--line);
  }
  .notes h2{
    margin:0 0 14px;
    font-size:12px;
    font-weight:600;
    letter-spacing:.6px;
    color:var(--muted);
  }
  .notes ol{
    list-style:none;
    counter-reset:note;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .notes li{
    position:relative;
    padding-left:18px;
    font-size:13.5px;
    line-height:1.7;
  }
  .notes li::before{
    counter-increment:note;
    content:counter(note) ".";
    position:absolute;
    left:0;top:0;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-top:48px;
    padding-top:18px;
    border-top:1px solid var(--line);
    font-size:11.5px;
    color:var(--muted);
  }
  footer a{
    color:inherit;
    text-decoration:none;
    border-bottom:1px solid transparent;
  }
  footer a:hover{border-bottom-color:var(--line);}
  @media (max-width:440px){
    .shell{
      width:calc(100% - 36px);
      padding-top:36px;
    }
    .app-head{gap:14px;}
    .app-head img{width:56px;height:56px;border-radius:13px;}
    .app-head h1{font-size:21px;}
    .app-head .tagline{font-size:12.5px;}
    .meta{margin-top:18px;}
    .notes{margin-top:32px;padding-top:22px;}
    footer{margin-top:36px;}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.001ms !important;}
  }
</style>
</head>
<body>
  <div class="shell">
    <header class="app-head">
      <img src="assets/snowman.png" alt="雪宝记账图标">
      <div>
        <h1>雪宝记账</h1>
        <p class="tagline">轻巧的本地记账应用，账本只保存在你的手机里。</p>
      </div>
    </header>

    <p class="meta">
      <span>v1.6.4</span>
      <span>1.1 MB</span>
      <span>2026-11-10</span>
      <span>Android</span>
    </p>

    <a class="download" href="xuebao-v1.6.4.apk" download="雪宝记账-v1.6.4.apk">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>
      </svg>
      下载安卓安装包
    </a>
    <p class="hint">下载后打开安装；覆盖安装会保留原有账本数据。</p>

    <section class="notes">
      <h2>更新内容</h2>
      <ol>
        <li>提升液态玻璃通透度，卡片与面板边缘新增折射与高光。</li>
        <li>新增液态折射效果，可在 外观 → 主题 中开关。</li>
        <li>折射贴图按尺寸缓存，仅用于主要面板，滚动更流畅。</li>
      </ol>
    </section>

    <footer>
      <span>雪宝记账 · 本地记账</span>
      <a href="version.json">版本清单</a>
    </footer>
  </div>
</body>
</html>
