<head>

<style>
  :root{
    --site-bg:#eaf2fb;
    --site-fg:#16202e;
    --site-accent:#2f7cf6;
    --site-on-accent:#ffffff;
    --site-surface:rgba(255,255,255,.66);
    --site-muted:#5d6d82;
    --site-border:rgba(20,40,70,.10);
    --site-font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    --site-radius:26px;
    --site-space:1;
    --site-type:1;
    --site-motion:1;
  }
  *{box-sizing:border-box;}
  html,body{min-height:100%;}
  body{
    margin:0;padding:0;
    font-family:var(--site-font);
    color:var(--site-fg);
    background:var(--site-bg);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  body::before,
  body::after{
    content:"";
    position:fixed;border-radius:50%;pointer-events:none;filter:blur(10px);
    transition:opacity calc(400ms * var(--site-motion, 1));
  }
  body::before{
    width:min(78vw,520px);height:min(78vw,520px);
    left:-22vw;top:-18vh;
    background:radial-gradient(circle at 40% 40%,rgba(255,255,255,.95),rgba(196,222,250,.45) 55%,rgba(196,222,250,0) 72%);
  }
  body::after{
    width:min(70vw,460px);height:min(70vw,460px);
    right:-24vw;bottom:-16vh;
    background:radial-gradient(circle at 55% 45%,rgba(255,222,214,.7),rgba(255,222,214,0) 68%);
  }
  .shell{
    position:relative;z-index:1;
    width:min(100% - 36px,560px);
    margin:0 auto;
    padding:calc(34px * var(--site-space,1)) 0 calc(34px * var(--site-space,1));
    display:flex;flex-direction:column;gap:calc(16px * var(--site-space,1));
  }
  .topline{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:0 4px;
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    font-size:calc(13px * var(--site-type,1));
    font-weight:650;letter-spacing:.3px;
    color:var(--site-muted);
  }
  .brand img{
    width:26px;height:26px;border-radius:8px;
    box-shadow:0 4px 12px rgba(20,40,70,.14);
  }
  .status{
    display:inline-flex;align-items:center;gap:6px;
    height:26px;padding:0 11px;border-radius:999px;
    background:color-mix(in srgb,var(--site-accent) 10%,transparent);
    color:var(--site-accent);
    font-size:calc(11.5px * var(--site-type,1));font-weight:650;
    white-space:nowrap;
  }
  .status::before{
    content:"";width:6px;height:6px;border-radius:50%;
    background:currentColor;
    box-shadow:0 0 0 4px color-mix(in srgb,var(--site-accent) 14%,transparent);
  }
  main{
    position:relative;overflow:hidden;
    background:var(--site-surface);
    border:1px solid var(--site-border);
    border-radius:var(--site-radius);
    box-shadow:
      0 2px 4px rgba(20,40,70,.03),
      0 24px 60px -24px rgba(30,60,100,.35),
      inset 0 1px 0 rgba(255,255,255,.9);
    -webkit-backdrop-filter:blur(24px) saturate(160%);
    backdrop-filter:blur(24px) saturate(160%);
  }
  main::before{
    content:"";position:absolute;inset:0 0 auto;height:170px;
    background:
      radial-gradient(120% 130% at 15% -20%,rgba(255,255,255,.95),rgba(255,255,255,0) 60%),
      radial-gradient(90% 110% at 90% 0%,rgba(188,217,252,.7),rgba(188,217,252,0) 65%);
    pointer-events:none;
  }
  .hero{
    position:relative;
    display:flex;flex-direction:column;align-items:center;text-align:center;
    padding:calc(28px * var(--site-space,1)) calc(22px * var(--site-space,1)) 0;
  }
  .icon-wrap{
    position:relative;width:96px;height:96px;
    display:grid;place-items:center;
    border-radius:calc(var(--site-radius) * .62);
    background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.55));
    border:1px solid rgba(255,255,255,.95);
    box-shadow:0 18px 40px -18px rgba(30,70,120,.55),inset 0 1px 0 #fff;
  }
  .icon-wrap img{width:84px;height:84px;border-radius:calc(var(--site-radius) * .5);display:block;}
  .icon-wrap::after{
    content:"";position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);
    width:52px;height:10px;border-radius:50%;
    background:rgba(40,70,110,.18);filter:blur(5px);
  }
  h1{
    margin:calc(20px * var(--site-space,1)) 0 0;
    font-size:calc(30px * var(--site-type,1));
    line-height:1.18;letter-spacing:-.5px;
    font-weight:750;
  }
  .tagline{
    margin:8px 0 0;
    color:var(--site-muted);
    font-size:calc(13.5px * var(--site-type,1));
    line-height:1.7;
    max-width:30em;
  }
  .version-row{
    display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:7px;
    margin-top:calc(15px * var(--site-space,1));
  }
  .pill{
    display:inline-flex;align-items:center;height:28px;padding:0 12px;
    border-radius:999px;border:1px solid var(--site-border);
    background:rgba(255,255,255,.55);
    font-size:calc(12px * var(--site-type,1));font-weight:600;
    color:var(--site-muted);
    font-variant-numeric:tabular-nums;
  }
  .pill strong{color:var(--site-fg);font-weight:700;margin-left:5px;}
  .actions{
    display:flex;flex-direction:column;align-items:center;gap:10px;
    padding:calc(22px * var(--site-space,1)) calc(22px * var(--site-space,1)) calc(8px * var(--site-space,1));
  }
  .download{
    width:100%;max-width:360px;
    display:flex;align-items:center;justify-content:center;gap:9px;
    height:54px;border-radius:calc(var(--site-radius) * .68);
    background:linear-gradient(180deg,color-mix(in srgb,var(--site-accent) 82%,#fff),var(--site-accent));
    color:var(--site-on-accent);
    font-family:inherit;font-size:calc(16px * var(--site-type,1));font-weight:700;
    text-decoration:none;
    box-shadow:0 16px 30px -16px color-mix(in srgb,var(--site-accent) 72%,transparent),inset 0 1px 0 rgba(255,255,255,.35);
    transition:transform calc(160ms * var(--site-motion,1)) ease,box-shadow calc(160ms * var(--site-motion,1)) ease;
  }
  .download:active{transform:scale(.985);box-shadow:0 8px 18px -12px color-mix(in srgb,var(--site-accent) 70%,transparent);}
  .download svg{width:18px;height:18px;flex:none;}
  .hint{
    margin:0;color:var(--site-muted);
    font-size:calc(11.5px * var(--site-type,1));line-height:1.6;text-align:center;
  }
  .divider{
    height:1px;margin:calc(18px * var(--site-space,1)) calc(22px * var(--site-space,1)) 0;
    background:linear-gradient(90deg,transparent,var(--site-border),transparent);
  }
  .notes{
    padding:calc(18px * var(--site-space,1)) calc(22px * var(--site-space,1)) calc(24px * var(--site-space,1));
  }
  .notes h2{
    margin:0 0 12px;font-size:calc(13px * var(--site-type,1));
    font-weight:700;letter-spacing:.2px;color:var(--site-muted);
  }
  .notes ul{
    list-style:none;margin:0;padding:0;
    display:flex;flex-direction:column;gap:10px;
  }
  .notes li{
    position:relative;padding-left:20px;
    font-size:calc(13.5px * var(--site-type,1));line-height:1.65;
  }
  .notes li::before{
    content:"";position:absolute;left:2px;top:.62em;
    width:7px;height:7px;border-radius:2px;
    background:color-mix(in srgb,var(--site-accent) 70%,#fff);
    transform:rotate(45deg);
  }
  footer{
    padding:2px 4px 0;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    color:var(--site-muted);
    font-size:calc(11px * var(--site-type,1));
  }
  footer a{color:inherit;text-decoration:none;}
  @media (max-width:420px){
    .shell{width:calc(100% - 28px);padding-top:22px;}
    .icon-wrap{width:84px;height:84px;}
    .icon-wrap img{width:74px;height:74px;}
    h1{font-size:calc(27px * var(--site-type,1));}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.001ms !important;animation-duration:.001ms !important;}
  }
</style>
</head>
